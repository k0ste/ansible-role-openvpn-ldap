---
- name: "openvpn | Delete user archive"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' +
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.zip' }}"
    state: "absent"
  listen: "Delete user archive"
  delegate_to: "localhost"
  become: false
  run_once: true
- name: "openvpn | Delete fetched files"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' +
      lookup('ansible.builtin.vars', 'openvpn_instance_name') }}"
    state: "absent"
  listen: "Delete fetched files"
  delegate_to: "localhost"
  become: false
  run_once: true
- name: "openvpn | Delete temp openssl.conf"
  ansible.builtin.file:
    path: "/tmp/openssl.conf"
    state: "absent"
  listen: "Delete temp openssl.conf"
- name: "openvpn | Daemon reload"
  ansible.builtin.systemd:
    daemon_reload: "yes"
  listen: "Daemon reload"
- name: "openvpn | Restart OpenVPN"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_service') ~ ovpn['name'] }}"
    state: "restarted"
  listen: "Restart OpenVPN"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'openvpn_restart', default='')) == 'true'"
    - "ovpn['name'] not in ['', [], '[]', None]"
  vars:
    openvpn_restart: "[] | map(&restart || 'false', @) | [0]"
