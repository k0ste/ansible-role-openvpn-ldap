---
- name: "openvpn | Deploy openvpn-auth-ldap plugin configuration"
  ansible.builtin.template:
    src: "plugin.d/auth_ldap.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_server_conf_dest') + '/'
      ~ ovpn['name'] ~ '/auth_ldap.conf' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'outer_item',
      default='')['plugin_auth_ldap'] == 'true'"
