---
- name: "openvpn | Copy instance cert"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.crt' }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
- name: "openvpn | Copy instance key"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.key' }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
- name: "openvpn | Copy root certificate to instance"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['root_crt'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
- name: "openvpn | Copy takey to instance"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['tls_auth'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - "ovpn['tls_auth'] is defined"
- name: "openvpn | Copy DH to instance"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['dh'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') + '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - "lookup('ansible.builtin.vars', 'outer_item')['type'] == 'server'"
    - "ovpn['dh'] is defined"
    - "ovpn['dh'] not in ['', [], '[]', None]"
- name: "openvpn | Copy TLS files for server instance"
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['crl_verify'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  diff: false
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - "lookup('ansible.builtin.vars', 'outer_item')['type'] == 'server'"
    - "ovpn['crl_verify'] is defined"
    - "ovpn['crl_verify'] not in ['', [], '[]', None]"
