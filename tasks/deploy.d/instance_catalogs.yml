---
- name: "openvpn | Create client config catalogs"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_server_conf_dest') + '/' ~
      lookup('ansible.builtin.vars', 'outer_item')['name'] }}"
    state: "directory"
    group: "{{ lookup('ansible.builtin.vars', 'outer_item')['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ lookup('ansible.builtin.vars', 'outer_item')['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0750"
  when:
    - "lookup('ansible.builtin.vars', 'outer_item')['type'] == 'server'"
    - "lookup('ansible.builtin.vars', 'outer_item')['ccd'] is defined"
    - "lookup('ansible.builtin.vars', 'outer_item')['ccd'] == 'true'"
- name: "openvpn | Create tls catalogs"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') ~ '/' ~ ovpn['name'] ~ '/tls' }}"
    state: "directory"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0750"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
- name: "openvpn | Create systemd service override catalogs"
  ansible.builtin.file:
    path: "{{ '/etc/systemd/system/' +
      lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] + '_service') +
      ovpn['name'] + '.service.d' }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_systemd_override', default='')
      == 'true'"
