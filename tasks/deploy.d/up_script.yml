---
- name: "openvpn | Deploy OpenVPN up script"
  ansible.builtin.copy:
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') + '/' + ovpn['name'] + '/' + ovpn['name'] + '_up.sh' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0755"
    content: "{{ ovpn['up'] }}"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['up'] is defined"
    - "ovpn['up'] not in ['', [], '[]', None]"
  notify:
    - "Restart OpenVPN"
