---
- name: "openvpn | Deploy OpenVPN configuration"
  ansible.builtin.template:
    src: "openvpn_conf.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_conf_dest') + '/' + ovpn['name'] + '.conf' }}"
    group: "{{ ovpn['group'] |
      default(lookup('ansible.builtin.vars', 'openvpn_group')) }}"
    owner: "{{ ovpn['user'] |
      default(lookup('ansible.builtin.vars', 'openvpn_user')) }}"
    mode: "0644"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  notify:
    - "Restart OpenVPN"
- name: "openvpn | Deploy clients configuration"
  ansible.builtin.template:
    src: "client_config_dir.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_server_conf_dest') + '/' ~
      lookup('ansible.builtin.vars', 'outer_item')['name'] ~ '/' ~
      ovpn['cn'] }}"
    group: "{{ ovpn['group'] | default(lookup('ansible.builtin.vars',
      'openvpn_group')) }}"
    owner: "{{ ovpn['user'] | default(lookup('ansible.builtin.vars',
      'openvpn_user')) }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~
    \"'].ccd_settings[]\") | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' ~ lookup('ansible.builtin.vars',
      'outer_item')['type'] ~ ': ' ~ lookup('ansible.builtin.vars',
      'outer_item')['name'] ~ ': ' ~ ovpn['cn'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'outer_item')['type'] == 'server'"
    - "lookup('ansible.builtin.vars', 'outer_item')['ccd'] is defined"
    - "lookup('ansible.builtin.vars', 'outer_item')['ccd'] == 'true'"
