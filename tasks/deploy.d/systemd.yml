---
- name: "openvpn | Override OpenVPN service configuration"
  ansible.builtin.template:
    src: "openvpn_service.j2"
    dest: "{{ '/etc/systemd/system/' +
      lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] + '_service') +
      ovpn['name'] + '.service.d/' + ovpn['name'] + '.conf' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  notify:
    - "Daemon reload"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_systemd_override', default='')
      == 'true'"
- name: "openvpn | Enable OpenVPN service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn['type'] +
      '_service') ~ ovpn['name'] }}"
    enabled: "yes"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn', default='') not in
      ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'openvpn_enable', default='')) == 'true'"
  vars:
    openvpn_enable: "[] | map(&enable || 'false', @) | [0]"
