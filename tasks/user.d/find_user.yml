---
- name: "openvpn | Get user mail address from LDAP"
  community.general.ldap_search:
    attrs:
      - "{{ lookup('ansible.builtin.vars', 'openvpn_ldap_settings')['mail_field'] }}"
    bind_dn: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['binddn'] | default(omit) }}"
    bind_pw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['password'] | default(omit) }}"
    dn: "{{ lookup('ansible.builtin.vars', 'openvpn_ldap_settings')['base'] }}"
    filter: "{{ '(' + lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['filter'] + '=' ~ lookup('ansible.builtin.vars',
      'openvpn_instance_name') ~ ')' }}"
    scope: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['scope'] | default(omit) }}"
    server_uri: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['host'] }}"
    start_tls: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['tls'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['tls_reqcert'] | default(omit) }}"
  register: "openvpn_ldap_user_result"
- name: "openvpn | Check user is present on LDAP"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'openvpn_ldap_user_result')['results'] |
        ansible.builtin.json_query('[].dn[] | [0]') is defined"
    fail_msg: "{{ 'User ' ~ lookup('ansible.builtin.vars',
      'openvpn_instance_name') ~ ' not found' }}"
    success_msg: "{{ 'User ' ~ lookup('ansible.builtin.vars',
      'openvpn_instance_name') ~ ' is present on LDAP' }}"
    quiet: "true"
- name: "openvpn | Set fact about user e-mail"
  ansible.builtin.set_fact:
    openvpn_ldap_user_mail: "{{ lookup('ansible.builtin.vars',
      'openvpn_ldap_user_result')['results'] |
      ansible.builtin.json_query(\"[].\" + lookup('ansible.builtin.vars',
      'openvpn_ldap_settings')['mail_field'] + \" | [0]\") }}"
- name: "openvpn | Check user mail is valid e-mail address"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'openvpn_ldap_user_mail') is
        match(openvpn_user_email_regex)"
    fail_msg: "{{ 'User ' ~ lookup('ansible.builtin.vars',
      'openvpn_instance_name') ~ ' mail address not found' }}"
    quiet: "true"
  vars:
    openvpn_user_email_regex:
      '^[a-zA-Z0-9.!#$%&*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$'
