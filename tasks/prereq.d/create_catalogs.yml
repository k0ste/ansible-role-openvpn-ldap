---
- name: "openvpn | Create OpenVPN configuration dir"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars',
      'openvpn_' + ovpn + '_conf_dest') }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'openvpn_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'openvpn_group') }}"
    mode: "0755"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances_types') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn +
      '_conf_dest') }}"
- name: "openvpn | Create OpenVPN static pool dir"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_pool_dest') }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'openvpn_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'openvpn_group') }}"
    mode: "0755"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances_types') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn +
      '_conf_dest') }}"
  when:
    - "ovpn == 'server'"
- name: "openvpn | Create OpenVPN status dir"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_pool_dest') }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'openvpn_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'openvpn_group') }}"
    mode: "0755"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances_types') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn +
      '_conf_dest') }}"
  when:
    - "ovpn == 'server'"
- name: "openvpn | Create OpenVPN OTP counters dir"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_plugin_otp_dest') }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'openvpn_user') }}"
    group: "{{ lookup('ansible.builtin.vars', 'openvpn_group') }}"
    mode: "0755"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances_types') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ lookup('ansible.builtin.vars', 'openvpn_' + ovpn +
      '_conf_dest') }}"
  when:
    - "ovpn == 'server'"
