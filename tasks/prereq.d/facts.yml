---
- name: "openvpn | Set facts about OpenVPN instances"
  ansible.builtin.set_fact:
    openvpn_instances: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query(\"[].openvpn_settings[].{
        name: name,
        type: type,
        ccd: client_config_dir,
        plugin_auth_ldap: plugins[].auth_ldap[].enabled | [0],
        plugin_otp: plugins[].otp[].enabled | [0]}\") }}"
- name: "openvpn | Assert that every OpenVPN instance have not null values"
  ansible.builtin.assert:
    that:
      - "ovpn['name'] not in ['', [], '[]', None]"
      - "ovpn['type'] in ['client', 'server']"
    fail_msg: "Some instance have not defined 'name' or 'type' fields"
    success_msg: "{{ 'name: ' ~ ovpn['name'] ~ ' | type: ' + ovpn['type'] }}"
    quiet: "true"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'check fields: ' ~ 'name: ' ~ ovpn['name'] ~ ', type: ' ~
      ovpn['type'] }}"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_instances', default='')
      not in ['', [], '[]', None]"
- name: "openvpn | Set facts about OpenVPN instances types"
  ansible.builtin.set_fact:
    openvpn_instances_types: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].openvpn_settings[].type[]') |
      ansible.builtin.unique() }}"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_instances', default='')
      not in ['', [], '[]', None]"
- name: "openvpn | Set facts about sysmted service settings"
  ansible.builtin.set_fact:
    openvpn_systemd_settings: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].systemd_settings[]') }}"
- name: "openvpn | Set facts about CA storage"
  ansible.builtin.set_fact:
    openvpn_ca_storage_type: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].ca_storage[].storage_type | [0]') }}"
    openvpn_ca_storage_source: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].ca_storage[].storage_source[] | [0]') }}"
- name: "openvpn | Assert that storage type have proper value"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_type') in
        ['file', 's3']"
    fail_msg: "ca_storage['storage_type'] have unknown value. Should be 'file'
      or 's3'"
    success_msg: "{{ 'ca_storage[\\'storage_type\\'] is: ' +
      lookup('ansible.builtin.vars', 'openvpn_ca_storage_type') }}"
    quiet: "true"
- name: "openvpn | Set facts about OpenVPN environment"
  ansible.builtin.set_fact:
    openvpn_csr_settings: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].global_settings[].csr[] | [0]') }}"
    openvpn_systemd_override: "{{ lookup('ansible.builtin.vars', 'openvpn') |
      community.general.json_query('[].systemd_settings[].restart_on_failure |
      [0]') }}"
