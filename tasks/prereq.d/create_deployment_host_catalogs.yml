---
- name: "openvpn | Set local facts"
  ansible.builtin.set_fact:
    openvpn_local_fetch_dir: "{{ lookup('ansible.builtin.vars', 'fetch_dir') +
      '_' ~ lookup('env', 'USER') }}"
- name: "openvpn | Create local catalog for fetched files"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') + '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') }}"
    state: "directory"
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0755"
  delegate_to: "localhost"
  become: false
  notify:
    - "Delete fetched files"
