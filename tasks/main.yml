---
- name: "openvpn | Assert that OpenVPN deployment scenario is defined"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'openvpn_scenario', default='') in
        ['deploy_user', 'deploy_instance']"
    fail_msg: "'openvpn_scenario' is undefined or have unknown value"
    success_msg: "{{ 'openvpn_scenario is: ' + lookup('ansible.builtin.vars',
      'openvpn_scenario', default='Unknown') }}"
    quiet: "true"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      not in ['', [], '[]', None]"
- name: "openvpn | Assert that OpenVPN settings"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'openvpn', default='')
        not in ['', [], '[]', None]"
    fail_msg: "'openvpn' settings is not defined or empty"
    success_msg: "'openvpn' settings dictonary exists"
    quiet: "true"
- name: "openvpn | Import instance deployment tasks"
  ansible.builtin.include_tasks:
    file: "scenarios.d/instance.yml"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_scenario',
      default='') == 'deploy_instance'"
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      in ['', [], '[]', None]"
- name: "openvpn | Import user deployment tasks"
  ansible.builtin.include_tasks:
    file: "scenarios.d/user.yml"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_scenario',
      default='') == 'deploy_user'"
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      in ['', [], '[]', None]"
- name: "openvpn | Import CRL deployment tasks"
  ansible.builtin.include_tasks:
    file: "scenarios.d/crl.yml"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      not in ['', [], '[]', None]"
