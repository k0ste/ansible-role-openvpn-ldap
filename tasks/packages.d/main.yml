---
- name: "openvpn | Import filestore packages tasks [master]"
  ansible.builtin.include_tasks:
    file: "packages.d/filestore_master.yml"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_type',
      default='') == 'file'"
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='') in
      ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_source',
      default='')['delegate_host'] not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_source',
      default='')['delegate_user'] not in ['', [], '[]', None]"
- name: "openvpn | Import filestore packages tasks [host]"
  ansible.builtin.include_tasks:
    file: "packages.d/host.yml"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn', default='') not in
      ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'openvpn_install_package', default='')) == 'true'"
    - "lookup('ansible.builtin.vars', 'openvpn_scenario') == 'deploy_instance'"
  vars:
    openvpn_install_package: "[] | map(&install_package || 'false', @) | [0]"
