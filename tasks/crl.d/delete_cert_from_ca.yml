---
- name: "openvpn | Delete instance key from CA (S3)"
  amazon.aws.s3_object:
    aws_access_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_access_key'] | default(omit) }}"
    aws_secret_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_secret_key'] | default(omit) }}"
    bucket: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['bucket'] | default(omit) }}"
    ignore_nonexistent_bucket: "true"
    rgw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['rgw'] | default(omit) }}"
    endpoint_url: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['endpoint_url'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['validate_certs'] | default(omit) }}"
    region: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['region'] | default(omit) }}"
    profile: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['profile'] | default(omit) }}"
    mode: "delobj"
    object: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['object_prefix'] ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.key' }}"
- name: "openvpn | Delete instance cert from CA (S3)"
  amazon.aws.s3_object:
    aws_access_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_access_key'] | default(omit) }}"
    aws_secret_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_secret_key'] | default(omit) }}"
    bucket: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['bucket'] | default(omit) }}"
    ignore_nonexistent_bucket: "true"
    rgw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['rgw'] | default(omit) }}"
    endpoint_url: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['endpoint_url'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['validate_certs'] | default(omit) }}"
    region: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['region'] | default(omit) }}"
    profile: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['profile'] | default(omit) }}"
    mode: "delobj"
    object: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['object_prefix'] ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.crt' }}"
