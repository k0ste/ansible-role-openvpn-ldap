---
- name: "openvpn | Include CA deployment tasks [filestore]"
  ansible.builtin.include_tasks:
    file: "ca.d/filestore/main.yml"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "outer_item"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_type') == 'file'"
    - "outer_item['name'] not in ['', [], '[]', None]"
- name: "openvpn | Include CA deployment tasks [S3]"
  ansible.builtin.include_tasks:
    file: "ca.d/s3/main.yml"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn_instances') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "outer_item"
  when:
    - "lookup('ansible.builtin.vars', 'openvpn_revoke_target', default='')
      in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'openvpn_ca_storage_type') == 's3'"
    - "outer_item['name'] not in ['', [], '[]', None]"
