---
- name: "openvpn | Fetch instance key from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['root_path'] ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.key' }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
- name: "openvpn | Fetch instance cert from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['root_path'] ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '.crt' }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
- name: "openvpn | Fetch instance root from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['root_path'] ~ '/' ~
      lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['root_crt'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
- name: "openvpn | Fetch instance takey from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['openvpn_path'] ~ '/' ~ ovpn['tls_auth'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['tls_auth'] is defined"
    - "ovpn['tls_auth'] not in ['', [], '[]', None]"
- name: "openvpn | Fetch CRL from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['crl_path'] ~ '/' ~ ovpn['crl_verify'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['type'] == 'server'"
    - "ovpn['crl_verify'] is defined"
    - "ovpn['crl_verify'] not in ['', [], '[]', None]"
- name: "openvpn | Fetch DHPARAM from CA (filestore)"
  ansible.builtin.fetch:
    src: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['openvpn_path'] ~ '/' ~ ovpn['dh'] }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' }}"
    flat: "yes"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['type'] == 'server'"
    - "ovpn['dh'] is defined and ovpn['dh'] not in ['', [], '[]', None]"
