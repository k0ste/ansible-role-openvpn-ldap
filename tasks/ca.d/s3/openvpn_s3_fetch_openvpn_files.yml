---
- name: "openvpn | Fetch instance takey from CA (S3)"
  amazon.aws.s3_object:
    aws_access_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_access_key'] | default(omit) }}"
    aws_secret_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_secret_key'] | default(omit) }}"
    bucket: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['bucket'] | default(omit) }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['tls_auth'] }}"
    ignore_nonexistent_bucket: "true"
    rgw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['rgw'] | default(omit) }}"
    endpoint_url: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['endpoint_url'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['validate_certs'] | default(omit) }}"
    region: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['region'] | default(omit) }}"
    profile: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['profile'] | default(omit) }}"
    mode: "get"
    object: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['object_prefix'] ~ '/' ~
      lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['openvpn_path'] ~ '/' ~ ovpn['tls_auth'] }}"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['tls_auth'] is defined"
    - "ovpn['tls_auth'] not in ['', [], '[]', None]"
- name: "openvpn | Fetch CRL from CA (S3)"
  amazon.aws.s3_object:
    aws_access_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_access_key'] | default(omit) }}"
    aws_secret_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_secret_key'] | default(omit) }}"
    bucket: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['bucket'] | default(omit) }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['crl_verify'] }}"
    ignore_nonexistent_bucket: "true"
    rgw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['rgw'] | default(omit) }}"
    endpoint_url: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['endpoint_url'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['validate_certs'] | default(omit) }}"
    region: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['region'] | default(omit) }}"
    profile: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['profile'] | default(omit) }}"
    mode: "get"
    object: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['object_prefix'] ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_ca_storage_source')['crl_path'] ~
      '/' ~ ovpn['crl_verify'] }}"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['type'] == 'server'"
    - "ovpn['crl_verify'] is defined"
    - "ovpn['crl_verify'] not in ['', [], '[]', None]"
- name: "openvpn | Fetch DHPARAM from CA (S3)"
  amazon.aws.s3_object:
    aws_access_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_access_key'] | default(omit) }}"
    aws_secret_key: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['aws_secret_key'] | default(omit) }}"
    bucket: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['bucket'] | default(omit) }}"
    dest: "{{ lookup('ansible.builtin.vars', 'openvpn_local_fetch_dir') ~ '/' ~
      lookup('ansible.builtin.vars', 'openvpn_instance_name') ~ '/' ~
      ovpn['dh'] }}"
    ignore_nonexistent_bucket: "true"
    rgw: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['rgw'] | default(omit) }}"
    endpoint_url: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['endpoint_url'] | default(omit) }}"
    validate_certs: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['validate_certs'] | default(omit) }}"
    region: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['region'] | default(omit) }}"
    profile: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['profile'] | default(omit) }}"
    mode: "get"
    object: "{{ lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['object_prefix'] ~ '/' ~
      lookup('ansible.builtin.vars',
      'openvpn_ca_storage_source')['openvpn_path'] ~ '/' ~ ovpn['dh'] }}"
  loop: "{{ lookup('ansible.builtin.vars', 'openvpn') |
    community.general.json_query(\"[].openvpn_settings[?name=='\" ~
    lookup('ansible.builtin.vars', 'outer_item')['name'] ~ \"']\") |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ovpn"
    label: "{{ 'openvpn-' + ovpn['type'] + ': ' ~ ovpn['name'] }}"
  when:
    - "ovpn['type'] == 'server'"
    - "ovpn['dh'] is defined"
    - "ovpn['dh'] not in ['', [], '[]', None]"
